[project]
name = "axiomcart-ai-assistant"
version = "1.0.0"
description = "A teachable multi-agent shopping assistant built with LangGraph and FastAPI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.117.1,<1",
    "langchain>=1.3,<2",
    "langchain-openai>=1.3.5,<2",
    "langgraph>=1.2.9,<2",
    "openai>=2,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.vercel]
entrypoint = "api.index:app"
